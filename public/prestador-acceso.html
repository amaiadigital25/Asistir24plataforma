<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistir24 - Prestadores</title><link rel="stylesheet" href="/styles.css"><style>.provider-note{margin-top:18px;padding:14px;border:1px solid #dbe4f0;border-radius:12px}.provider-note strong{display:block;margin-bottom:4px}</style></head><body class="login-page"><main class="login-shell"><section class="login-panel"><div class="brand-mark">A24</div><p class="eyebrow">SECTOR PRESTADORES</p><h1>Facturación</h1><p class="muted">Cargá la factura de un servicio y consultá el estado de la orden de compra.</p><form id="loginForm" class="stack"><label>Usuario<input id="username" autocomplete="username" required placeholder="Usuario"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required placeholder="Contraseña"></label><button class="btn primary" type="submit">Ingresar</button><p id="message" class="message"></p></form><div class="provider-note"><strong>Acceso exclusivo para prestadores habilitados.</strong><span class="muted">Cada factura se valida contra el número de servicio para evitar cargas duplicadas.</span></div></section></main><script>const token=localStorage.getItem('a24_token'),role=localStorage.getItem('a24_role');if(token&&role==='prestador')location.href='/prestador';document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent='Validando...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'No se pudo iniciar sesión');if(d.role!=='prestador')throw new Error('Esta cuenta no corresponde al sector Prestadores');localStorage.setItem('a24_token',d.token);localStorage.setItem('a24_role',d.role);location.href='/prestador'}catch(err){m.textContent=err.message}});</script></body></html>
