<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistir24 - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

  <div class="login-box">

    <h1>Asistir24</h1>
    <p class="subtitle">Sistema de asistencia y emergencias</p>

    <!-- 🔐 LOGIN -->
    <h2>Iniciar sesión</h2>
    <input type="text" id="user" placeholder="Usuario">
    <input type="password" id="pass" placeholder="Contraseña">
    <button class="btn-primary" onclick="login()">Ingresar</button>

    <hr>

    <!-- 🚗 DATOS DEL VEHÍCULO -->
    <h3>Datos del vehículo</h3>
    <input type="text" id="patente" placeholder="Patente">
    <input type="text" id="modelo" placeholder="Modelo">
    <input type="text" id="color" placeholder="Color">

    <!-- 🚨 EMERGENCIA -->
    <button class="btn-emergency" onclick="enviarEmergencia()">🚨 Enviar Emergencia</button>

  </div>

</div>

<script>
async function login() {
  const username = document.getElementById('user').value;
  const password = document.getElementById('pass').value;

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem('token', data.token);
    window.location.href = "/admin";
  } else {
    alert("Credenciales incorrectas");
  }
}

// 🚨 EMERGENCIA CON WHATSAPP + UBICACIÓN
function enviarEmergencia() {

  const patente = document.getElementById('patente').value;
  const modelo = document.getElementById('modelo').value;
  const color = document.getElementById('color').value;

  if (!navigator.geolocation) {
    alert("La geolocalización no está disponible");
    return;
  }

  navigator.geolocation.getCurrentPosition((pos) => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const ubicacion = `https://www.google.com/maps?q=${lat},${lon}`;

    const mensaje = `🚨 EMERGENCIA Asistir24
Vehículo:
Patente: ${patente}
Modelo: ${modelo}
Color: ${color}

Ubicación: ${ubicacion}`;

    // 👉 CAMBIÁ ESTE NÚMERO POR EL TUYO
    const telefono = "5491126433243";

    const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;

    window.open(url, "_blank");

  }, () => {
    alert("No se pudo obtener la ubicación");
  });
}
</script>

</body>
</html>
