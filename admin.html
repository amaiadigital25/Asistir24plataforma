<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
<h1>Panel Admin</h1>
</header>

<div class="container">

<div id="lista"></div>

</div>

<script>
const API = "https://asistir24plataforma-production.up.railway.app";

async function cargar(){
  const res = await fetch(API + "/emergencias");
  const data = await res.json();

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  data.forEach(e => {
    lista.innerHTML += `
      <div class="card">
        <h3>${e.patente}</h3>
        <p>${e.modelo}</p>
        <p>${e.color}</p>
        <a href="${e.ubicacion}" target="_blank">Ver ubicación</a>
      </div>
    `;
  });
}

setInterval(cargar, 3000);
cargar();
</script>

</body>
</html>
